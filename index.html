 tk.forEach(v=>{s+=`<line x1="${x0}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v?'#E5E7EF':'#CBD0DC'}"/><text x="44" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#98A1B3">${fmt(v)}</text>`});
 A.forEach((a,i)=>{const met=a>=T[i],bx=x0+sl*i+(sl-bw)/2,by=Y(a);
  s+=`<g class="col" data-i="${i}" tabindex="0" style="cursor:pointer"><rect class="hl" x="${x0+sl*i}" y="${top}" width="${sl}" height="${ph}" fill="#EEF0FF" opacity="0"/>`+
  `<path d="M${bx} ${Y(0)}V${by+5}a5 5 0 0 1 5-5h${bw-10}a5 5 0 0 1 5 5V${Y(0)}Z" fill="${met?'#4F46E5':'#B8BEF7'}"/>`+
  `<text x="${bx+bw/2}" y="${by+20}" text-anchor="middle" font-size="11" font-weight="500" fill="${met?'#fff':'#0F172A'}">${lab(a)}</text>`+
  `<rect x="${bx-8}" y="${Y(T[i])-1.5}" width="${bw+16}" height="3" fill="#0F172A"/>`+
  `<text x="${x0+sl*i+sl/2}" y="${top+ph+22}" text-anchor="middle" font-size="12" font-weight="500" fill="#5B6475">${L[i]}</text></g>`});
 return s+'</svg><div class="tip" id="tip"></div>';
}
function wireChart(d){
 const q=S.mode==='q',L=q?d.ql:MN,A=q?d.qa:d.a,T=q?d.qt:d.t,pl=$('.plot'),tip=$('#tip'),sl=764/A.length;
 const full=['January','February','March','April','May','June','July','August','September','October'];
 const show=g=>{const i=+g.dataset.i,v=((A[i]/T[i]-1)*100);g.querySelector('.hl').setAttribute('opacity','.9');
  tip.innerHTML=`<b>${q?L[i]:full[i]+' 2026'}</b><div>Closed-won<span>${lab(A[i])}</span></div><div>Target<span>${lab(T[i])}</span></div><div>vs. target<span style="color:${v>=0?'#6EE7A0':'#FCA5A5'}">${v>=0?'+':'−'}${Math.abs(v).toFixed(1)}%</span></div>`;
  const sc=pl.clientWidth/816;let x=(52+sl*i)*sc-182;if(x<0)x=(52+sl*(i+1))*sc+6;tip.style.left=x+'px';tip.style.top='4px';tip.style.display='block'};
 const hide=g=>{g.querySelector('.hl').setAttribute('opacity','0');tip.style.display='none'};
 pl.querySelectorAll('.col').forEach(g=>{g.onmouseenter=()=>show(g);g.onmouseleave=()=>hide(g);g.onfocus=()=>show(g);g.onblur=()=>hide(g)});
}

/* ---------- render ---------- */
function render(){
 const d=D[S.region],q=S.mode==='q',filtered=S.region!=='all';
 $('#sub').textContent=`${d.label} · Jan 1 – Oct 31, 2026 · Updated today, 9:40 AM`;
 let reps=[...d.reps].sort((a,b)=>S.sort==='win'?b.win-a.win:b.won-a.won);
 const iv=q?d.insQ:d.ins,mxF=d.f[0][1],shade=['#312E81','#4F46E5','#818CF8','#C7CBFA'];
 root.innerHTML=`
 <div class="filters">
  <button class="chip">${ic('cal')}Jan 1 – Oct 31, 2026${ic('chev')}</button>
  <button class="chip ${S.menu||filtered?'on':''}" id="regBtn" aria-haspopup="listbox" aria-expanded="${S.menu}"><small>Region</small>${d.label}${ic('chev')}</button>
  <button class="chip"><small>Segment</small>All${ic('chev')}</button>
  <button class="chip"><small>Owner</small>${filtered?'All India reps':'All reps'}${ic('chev')}</button>
  <div class="grow"></div><small style="color:var(--t2);font-size:12px">Compare</small>
  <div class="seg"><button class="on">vs. target</button><button>vs. 2025</button></div>
  <button class="reset ${filtered?'on':''}" id="reset">Reset</button>
  ${S.menu?`<div class="menu" id="menu" role="listbox" style="left:${$('#regBtn')?$('#regBtn').offsetLeft:190}px">${REGIONS.map(r=>`<button role="option" data-r="${r}" class="${r===d.label?'on':''}">${r}${r===d.label?ic('check',14,'#4F46E5'):''}</button>`).join('')}</div>`:''}
 </div>
 <div class="alert">${ic('warn',18)}<span><b>${d.alert[0]}</b>${d.alert[1]}</span><div class="grow"></div><button class="btn wn" id="review">Review deals</button></div>
 <div class="kpis">${d.kpis.map((k,i)=>`<div class="kpi ${i?'':'p'}"><span class="l">${k[0]}</span><span class="v">${k[1]}</span><span class="dl"><span class="dc ${k[4]?'g':'b'}">${ic(k[2][0]==='+'?'up':'down',12)}${k[2].replace(/^[+−]/,'')}</span>${k[3]}</span></div>`).join('')}</div>
 <div class="row">
  <section class="card"><div class="ch"><div><h2>Revenue vs. target</h2><p>Closed-won revenue by ${q?'quarter':'month'}</p></div><div class="grow"></div>
   <div class="seg"><button data-m="m" class="${q?'':'on'}">Monthly</button><button data-m="q" class="${q?'on':''}">Quarterly</button></div></div>
   <div class="insight"><b>${iv[0]}</b>${iv[1]}</div>
   <div class="legend"><span><i style="background:#4F46E5"></i>Met target</span><span><i style="background:#B8BEF7"></i>Below target</span><span><i style="background:#0F172A;height:3px;width:14px"></i>Target</span></div>
   <div class="plot">${chart(d)}</div></section>
  <section class="card"><div class="ch"><div><h2>Open pipeline by stage</h2><p>${d.ft}</p></div></div>
   ${d.f.map((s,i)=>`<div class="fn" data-stage="${i}" ${i===3?'tabindex="0" role="button" title="Review stalled deals"':''}><div class="t"><span class="nm">${s[0]}</span>${i===3?`<span class="stl">${ic('warn',11)}${d.stall} stalled</span>`:''}<span class="r"><b>$${s[1].toFixed(1)}M</b> <small>· ${s[2]} deals</small></span></div><div class="trk"><i style="width:${Math.max(10,100*s[1]/mxF)}%;background:${shade[i]}"></i></div></div>${i<3?`<div class="conv">${ic('down',12)}${Math.round(d.f[i+1][2]/s[2]*100)}% advance to ${d.f[i+1][0]}</div>`:''}`).join('')}
  </section>
 </div>
 <div class="row">
  <section class="card"><div class="ch"><div><h2>Rep performance</h2><p>${reps.length} of ${d.total} reps · sorted by ${S.sort==='win'?'win rate':'closed-won'} · click a row for details</p></div><div class="grow"></div><button class="btn" id="exp">${ic('dl',14)}Export</button></div>
   <div style="overflow-x:auto"><table><thead><tr><th>Rep</th><th class="${S.sort==='won'?'on':''}"><button data-s="won">Closed-won ${S.sort==='won'?ic('down',12):''}</button></th><th>Quota attainment</th><th class="${S.sort==='win'?'on':''}"><button data-s="win">Win rate ${S.sort==='win'?ic('down',12):''}</button></th><th>Pipeline</th><th>Status</th></tr></thead><tbody>
   ${reps.map(r=>{const st=status(r.att);return `<tr tabindex="0" data-rep="${r.n}"><td><div class="rep"><span class="av" style="width:28px;height:28px;font-size:11px;background:${AVC[REPS.indexOf(r)%6]}">${ini(r.n)}</span><div><b>${r.n}</b><small>${r.c}</small></div></div></td><td><b style="font-weight:600">$${r.won}K</b></td><td><div class="att"><div class="b"><i style="width:${Math.min(100,r.att)}%;background:${st[1]}"></i></div><b style="font-weight:600">${r.att}%</b></div></td><td style="${S.sort==='win'?'color:var(--br);font-weight:600':''}">${r.win}%</td><td>${r.pipe}</td><td><span class="pill" style="color:${st[1]};background:${st[2]}">${st[0]}</span></td></tr>`}).join('')}
   </tbody></table></div></section>
  <section class="card"><div class="ch"><div><h2>Win rate by industry</h2><p>Share of closed deals won · team avg. ${d.avg}%</p></div></div>
   <div class="bars">${d.ind.map(r=>`<div class="r"><span>${r[0]}</span><div class="t"><i style="width:${r[1]/40*100}%;background:${r[1]>=d.avg?'#4F46E5':'#B8BEF7'}"></i><span class="avg" style="left:${d.avg/40*100}%"></span></div><span class="v">${r[1]}%</span></div>`).join('')}</div>
   <div style="font-size:11px;font-weight:500;color:var(--t2);text-align:center">Vertical line = team avg. ${d.avg}%</div>
   <p style="font-size:12px;color:var(--t2)">${d.indIns}</p></section>
 </div>`;
 wireChart(d);
 $('#regBtn').onclick=e=>{e.stopPropagation();S.menu=!S.menu;render()};
 if(S.menu){document.querySelectorAll('#menu button').forEach(b=>b.onclick=()=>{const r=b.dataset.r;S.menu=false;if(r==='All APAC')S.region='all';else if(r==='India')S.region='india';else{toast(`Demo data covers All APAC and India. “${r}” is not in this prototype.`)}render()})}
 $('#reset').onclick=()=>{S.region='all';S.mode='m';S.sort='won';S.menu=false;render()};
 $('#review').onclick=openRisk;
 document.querySelector('[data-stage="3"]').onclick=openRisk;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;render()});
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sort=S.sort===b.dataset.s&&b.dataset.s==='win'?'won':b.dataset.s;render()});
 document.querySelectorAll('[data-rep]').forEach(tr=>{tr.onclick=()=>openRep(tr.dataset.rep);tr.onkeydown=e=>{if(e.key==='Enter')openRep(tr.dataset.rep)}});
 $('#exp').onclick=()=>{const rows=[['Rep','Region','Closed-won ($K)','Quota attainment (%)','Win rate (%)','Pipeline'],...reps.map(r=>[r.n,r.c,r.won,r.att,r.win,r.pipe])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='rep-performance.csv';a.click();toast('Exported rep-performance.csv')};
}
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('#menu')){S.menu=false;render()}});

/* ---------- drawers ---------- */
function close(){layer.innerHTML='';S.drawer=null}
function openRep(name){const r=REPS.find(x=>x.n===name),st=status(r.att),cols=['#312E81','#4F46E5','#818CF8','#C7CBFA'],nm=['Prospecting','Qualified','Proposal','Negotiation'];
 const dw=r.win-27.4,dc=r.cyc-68;
 layer.innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${r.n} details">
 <div class="dh"><span class="av" style="width:48px;height:48px;font-size:16px;background:${AVC[REPS.indexOf(r)%6]}">${ini(r.n)}</span><div><h3>${r.n}</h3><p>Account Executive · ${r.c}</p></div><button class="x" id="cl" aria-label="Close">${ic('x')}</button></div>
 <div style="display:flex;align-items:center;gap:8px"><span class="pill" style="color:${st[1]};background:${st[2]}">${st[0]}</span><small style="color:var(--t2);font-size:12px">${r.att}% of quota · ranked #${rank(r.n)} of 8</small></div>
 <div class="mk"><div><small>Closed-won</small><b>$${r.won}K</b></div><div><small>Win rate</small><b>${r.win}%</b></div><div><small>Pipeline</small><b>${r.pipe}</b></div></div>
 <div><h4>Pipeline mix</h4><div class="mix">${r.mix.map((m,i)=>`<i style="width:${m}%;background:${cols[i]}"></i>`).join('')}</div><div class="lg">${r.mix.map((m,i)=>`<span><i style="background:${cols[i]}"></i>${nm[i]} ${m}%</span>`).join('')}</div></div>
 <div><h4>Top open deals</h4>${r.deals.map(x=>`<div class="dr"><div><b style="font-weight:500">${x[0]}</b><small>${x[1]} · Close ${x[3]}</small></div><b>${x[2]}</b></div>`).join('')}</div>
 <div><h4>vs. team average</h4>
  <div class="dr"><span style="color:var(--t2)">Win rate</span><span><b>${r.win}%</b> <span class="dc ${dw>=0?'g':'b'}" style="margin-left:8px">${dw>=0?'+':'−'}${Math.abs(dw).toFixed(1)} pts</span></span></div>
  <div class="dr"><span style="color:var(--t2)">Sales cycle</span><span><b>${r.cyc} days</b> <span class="dc ${dc<=0?'g':'b'}" style="margin-left:8px">${dc<=0?'−':'+'}${Math.abs(dc)} days</span></span></div></div>
 <div class="grow"></div><button class="btn pri" style="justify-content:center;padding:10px" id="prof">Open full rep profile</button></aside>`;
 bindClose();$('#prof').onclick=()=>toast('Full rep profile is outside this prototype')}
function openRisk(){const d=D[S.region];
 layer.innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer w" role="dialog" aria-modal="true" aria-label="At-risk deals">
 <div class="dh"><span class="av" style="width:44px;height:44px;border-radius:12px;background:var(--wnB);color:var(--wn)">${ic('warn',20)}</span><div><h3>At-risk deals</h3><p>${d.riskSum} stuck in Negotiation for 30+ days</p></div><button class="x" id="cl" aria-label="Close">${ic('x')}</button></div>
 ${d.risk.map((x,i)=>`<div class="deal"><div class="a"><b>${x[0]}</b><span class="pill" style="color:var(--br);background:var(--brS)">Negotiation</span><b class="am">$${x[3]}K</b></div>
  <div class="b"><span class="av" style="width:20px;height:20px;font-size:9px;background:${AVC[i%6]}">${ini(x[1])}</span>${x[1]} · ${x[2]}<span class="pill" style="color:var(--neg);background:var(--negB)">${x[4]} days stalled</span></div>
  <div class="c"><div class="tk"><i style="width:${x[4]/45*100}%"></i></div><button class="btn nudge" data-k="${x[0]}">Nudge owner</button></div></div>`).join('')}
 <div class="grow"></div><div style="display:flex;gap:10px"><button class="btn" id="exl">${ic('dl',14)}Export list</button><button class="btn pri" id="nall">Nudge all owners</button></div></aside>`;
 bindClose();
 const mark=b=>{b.textContent='Nudged';b.classList.add('done')};
 document.querySelectorAll('.nudge').forEach(b=>{if(S.nudged[b.dataset.k])mark(b);b.onclick=()=>{S.nudged[b.dataset.k]=1;mark(b);toast('Reminder sent to owner')}});
 $('#nall').onclick=()=>{d.risk.forEach(x=>S.nudged[x[0]]=1);document.querySelectorAll('.nudge').forEach(mark);toast(`Reminders sent to ${d.risk.length} owners`)};
 $('#exl').onclick=()=>{const rows=[['Deal','Owner','Region','Amount ($K)','Days stalled'],...d.risk];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='at-risk-deals.csv';a.click();toast('Exported at-risk-deals.csv')}}
function bindClose(){$('#scrim').onclick=close;$('#cl').onclick=close;$('#cl').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();if(S.menu){S.menu=false;render()}}});
let tt;function toast(m){clearTimeout(tt);const o=document.querySelector('.toast');if(o)o.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);tt=setTimeout(()=>t.remove(),2600)}
$('#bell').onclick=openRisk;
render();
</script>
</body>
</html>
